<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Build a lighthouse</title>
    <style>
      * { box-sizing: border-box; }
      body { --u: min(0.66px, calc(100vw / 860)); margin: 0; overflow-x: hidden; background: #f3ecd9; color: #2a2118; font: 17px/1.35 Georgia, 'Times New Roman', serif; text-align: center; }
      .controls { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px; padding: 20px 12px 16px; }
      button { min-height: 44px; padding: 0 18px; border: 0; background: #b5402c; color: #fff8ea; font: inherit; cursor: pointer; transition: transform 0.12s, background-color 0.12s; }
      button:hover { background: #9c3423; }
      button:active { transform: scale(0.96); }
      button.quiet { background: #e4d9bd; color: #2a2118; }
      button.quiet:hover { background: #d8cba9; }
      button:disabled { opacity: 0.45; cursor: default; }
      .tower { display: flex; flex-direction: column; align-items: center; }
      .tower img { display: block; mix-blend-mode: multiply; }
      .top { width: calc(370 * var(--u)); height: calc(452 * var(--u)); }
      .floor { width: calc(370 * var(--u)); height: calc(222 * var(--u)); }
      .floor.new { animation: settle 0.34s cubic-bezier(0.16, 1, 0.3, 1); }
      @keyframes settle { from { opacity: 0; } }
      .base { width: calc(832 * var(--u)); height: calc(466 * var(--u)); }
      figcaption { padding: 10px 16px 24px; font-style: italic; }
      figure { margin: 0; }
      @media (prefers-reduced-motion: reduce) { .floor.new { animation: none; } }
    </style>
  </head>
  <body>
    <div class="controls">
      <button type="button" id="add">Add a floor</button>
      <button type="button" id="remove" class="quiet">Remove one</button>
    </div>
    <figure>
      <div class="tower">
        <img class="top" src="img/tower-top.jpg" width="370" height="452" alt="Lantern room of a red and white lighthouse" />
        <div id="floors"></div>
        <img class="base" src="img/tower-base.jpg" width="832" height="466" alt="Foot of the lighthouse on dark rocks" />
      </div>
      <figcaption>Fig. 1. A lighthouse of <span id="count"></span>. The page is as tall as the tower.</figcaption>
    </figure>
    <script>
      var MAX = 40;
      var floors = document.getElementById('floors');
      var count = document.getElementById('count');
      var add = document.getElementById('add');
      var remove = document.getElementById('remove');
      function refresh() {
        var n = floors.children.length + 2;
        count.textContent = n + ' floors';
        add.disabled = floors.children.length >= MAX;
        remove.disabled = floors.children.length === 0;
      }
      function addFloor(animate) {
        if (floors.children.length >= MAX) return;
        var floor = document.createElement('img');
        floor.className = animate ? 'floor new' : 'floor';
        floor.src = 'img/tower-floor.jpg';
        floor.alt = '';
        floor.width = 370;
        floor.height = 222;
        floors.insertBefore(floor, floors.firstChild);
        refresh();
      }
      add.onclick = function () { addFloor(true); };
      remove.onclick = function () { floors.removeChild(floors.firstChild); refresh(); };
      refresh();
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
        addFloor(false); addFloor(false);
      } else {
        var built = 0;
        var timer = setInterval(function () {
          addFloor(true);
          if (++built >= 2) clearInterval(timer);
        }, 600);
      }
    </script>
  </body>
</html>
